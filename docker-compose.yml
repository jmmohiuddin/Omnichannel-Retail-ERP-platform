# Local development infrastructure. App processes run on the host:
#   npx -y pnpm --filter @omniretail/api dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omniretail_dev
      POSTGRES_USER: omniretail
      POSTGRES_PASSWORD: omniretail_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniretail -d omniretail_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
