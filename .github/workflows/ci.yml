name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omniretail_test
          POSTGRES_USER: omniretail
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omniretail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck

      # Migrations must apply cleanly from an empty database exactly as they
      # would in production (standalone runner, not via a test's beforeAll),
      # and the applied set must then match the sql/ directory with zero drift.
      # This is the gate that guards against "code references a table that was
      # never migrated onto the target" — the class of bug that once broke a
      # live deploy silently.
      - name: Migrate a fresh database + assert no drift
        env:
          DATABASE_URL: postgres://omniretail:ci@localhost:5432/omniretail_test
        run: |
          node packages/db/dist/verify.js            # static: clean 001..N sequence
          node packages/db/dist/migrate.js           # apply from empty
          node packages/db/dist/verify.js --applied  # dynamic: files == applied

      - name: Test (unit + Postgres integration)
        env:
          ADMIN_DATABASE_URL: postgres://omniretail:ci@localhost:5432/omniretail_test
          DATABASE_URL: postgres://omniretail_app:omniretail_app_dev@localhost:5432/omniretail_test
        run: pnpm -r test
