name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omniretail_test
          POSTGRES_USER: omniretail
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omniretail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - name: Test (unit + Postgres integration)
        env:
          ADMIN_DATABASE_URL: postgres://omniretail:ci@localhost:5432/omniretail_test
          DATABASE_URL: postgres://omniretail_app:omniretail_app_dev@localhost:5432/omniretail_test
        run: pnpm -r test
